name: Build & Release M3-Redesign

on:
  push:
    branches:
      - main
    paths-ignore:
      - "patches-bundle.json"
      - "patches-list.json"
      - "README.md"
      - "LICENSE"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0). Leave blank to use default."
        required: false
        default: "v1.0.0"
      morphe_ref:
        description: "Upstream MorpheApp/morphe-patches branch or tag (leave blank for auto main/dev)"
        required: false
        default: ""
      publish_release:
        description: "Create/update a GitHub Release and update patches-bundle.json on main"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build Standalone .mpp Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout M3-Redesign
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build-config/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Determine build version and Morphe ref
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            [[ -z "$VERSION" ]] && VERSION="v1.0.0"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
          else
            VERSION="v1.0.0-dev.${GITHUB_SHA::7}"
            SHOULD_RELEASE="false"
          fi
          CLEAN_VERSION="${VERSION#v}"
          MORPHE_REF="${{ inputs.morphe_ref }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "clean_version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "morphe_ref=$MORPHE_REF" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build M3-Redesign .mpp
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          MORPHE_REF: ${{ steps.meta.outputs.morphe_ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build-local.sh
          ./scripts/build-local.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M3-Redesign-${{ steps.meta.outputs.version }}
          path: dist/

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: M3-Redesign ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*

      - name: Update patches-bundle.json on main for Morphe Manager
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
          CLEAN_VERSION: ${{ steps.meta.outputs.clean_version }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          MPP_NAME="$(basename "$(ls dist/*.mpp | head -n 1)")"
          CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%S")"
          DOWNLOAD_URL="https://github.com/${REPO_SLUG}/releases/download/${TAG_VERSION}/${MPP_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          python3 - <<'PY' "$CREATED_AT" "$DOWNLOAD_URL" "$CLEAN_VERSION"
          import json, sys
          created_at, download_url, version = sys.argv[1:4]
          bundle = {
              "created_at": created_at,
              "description": "Standalone Material 3 Expressive navigation bar and miniplayer redesign add-on for YouTube Music",
              "download_url": download_url,
              "signature_download_url": "",
              "version": version,
          }
          with open("patches-bundle.json", "w", encoding="utf-8") as f:
              json.dump(bundle, f, indent=2)
              f.write("\n")
          PY

          if [[ -f dist/patches-list.json ]]; then
            cp dist/patches-list.json patches-list.json
          fi

          git add patches-bundle.json
          [[ -f patches-list.json ]] && git add patches-list.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update patches-bundle.json for ${TAG_VERSION} [skip ci]"
            git push origin main
          fi
