name: Build & Release M3-Redesign

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0). Leave blank to use default."
        required: false
        default: "v1.0.0"
      morphe_ref:
        description: "Upstream MorpheApp/morphe-patches branch or tag (leave blank for auto main/dev)"
        required: false
        default: ""
      publish_release:
        description: "Create/update a GitHub Release with the built .mpp bundle"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build Standalone .mpp Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout M3-Redesign
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build-config/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Determine build version and Morphe ref
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            [[ -z "$VERSION" ]] && VERSION="v1.0.0"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
          else
            VERSION="v1.0.0-dev.${GITHUB_SHA::7}"
            SHOULD_RELEASE="false"
          fi
          MORPHE_REF="${{ inputs.morphe_ref }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "morphe_ref=$MORPHE_REF" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build M3-Redesign .mpp
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          MORPHE_REF: ${{ steps.meta.outputs.morphe_ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build-local.sh
          ./scripts/build-local.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M3-Redesign-${{ steps.meta.outputs.version }}
          path: dist/

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: M3-Redesign ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
